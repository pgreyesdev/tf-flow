[project]
name = "tf-flow-api"
version = "0.1.0"
description = "API REST de TF-FLOW."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "openai>=3.37.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tf-flow-ml",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tf_flow_api"]
