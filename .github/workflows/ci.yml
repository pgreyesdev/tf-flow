name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Tests y cobertura
        run: uv run pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Imagen de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen
        run: docker build -f backend/Dockerfile -t tf-flow-api:ci .
      - name: Escanear vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tf-flow-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  web:
    name: Web · lint, tipos, tests y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formato
        run: pnpm format:check
      - name: Tipos
        run: pnpm typecheck
      - name: Tests y cobertura
        run: pnpm test --coverage
      - name: Compilación
        run: pnpm build
      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high

  web-docker:
    name: Imagen de la web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen
        run: docker build -t tf-flow-web:ci web
      - name: Escanear vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tf-flow-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docs:
    name: Documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --python 3.12 --only-group docs
      - run: uv run --only-group docs mkdocs build --strict
