site_name: TF-FLOW
site_description: Predicción de congestión en las carreteras de Tenerife
repo_url: https://github.com/pgreyesdev/tf-flow
docs_dir: docs
theme:
  name: material
  language: es
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Modo oscuro }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Modo claro }
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
nav:
  - Inicio: index.md
  - Arquitectura: arquitectura.md
  - Desarrollo: desarrollo.md
  - API: api.md
  - Decisiones (ADR):
      - adr/index.md
      - adr/0001-monorepo.md
      - adr/0002-backend-python-fastapi.md
      - adr/0003-validacion-temporal-y-baseline.md
      - adr/0004-app-android-nativa.md
      - adr/0005-convenciones.md
      - adr/0006-indice-de-congestion.md
